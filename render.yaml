# Render "Blueprint": tells render.com how to run the backend so the app works on any Wi-Fi or mobile data.
# Set up once: render.com → New → Blueprint → pick this GitHub repo. Render asks for DATABASE_URL (paste from backend/.env).
services:
  - type: web
    name: calap-alert-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false          # secret: you paste it in Render, it is never stored in git
      - key: JWT_SECRET
        generateValue: true  # Render makes a long random secret for logins
